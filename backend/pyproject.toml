[project]
name = "bookmarks-organizer"
version = "0.1.0"
description = "AI-powered bookmark organizer backend"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.97.0",
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "pydantic-settings>=2.13.1",
    "uvicorn[standard]>=0.44.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
anyio_mode = "asyncio"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pyrefly>=0.60.0",
    "pytest>=9.0.2",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.0",
    "ruff>=0.15.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bookmarks_organizer"]
